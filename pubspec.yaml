name: fitness_app
description: "Gym Journal with Google Sheets sync"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2

  googleapis: ^13.0.0
  googleapis_auth: ^1.6.0
  http: ^1.3.0

  firebase_core: ^3.4.0
  firebase_auth: ^5.4.0
  google_sign_in: ^6.2.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  package_info_plus: ^9.0.1
  flutter_downloader: ^1.11.0
  permission_handler: ^11.0.0

  share_plus: ^10.1.4
  image_picker: ^1.1.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/credentials.json